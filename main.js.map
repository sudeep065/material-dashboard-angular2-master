export default "<h3 mat-dialog-title>Material Dialog Sample</h3>\n<hr>\n<div mat-dialog-content>\n  <p>Title goes here</p>\n  <div class=\"row\">\n    <p>Below is the content which can be passed from any component.</p>\n  </div>\n</div>\n<br>\n<div mat-dialog-actions>\n  <button mat-raised-button type=\"submit\" class=\"btn btn-danger pull-right\" (click)=\"onNoClick()\">Ok, Got it.</button>\n</div>";
